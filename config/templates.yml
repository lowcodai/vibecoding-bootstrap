# config/templates.yml
# Mapping of project type -> files to include from the corresponding template
# Used by apply-template.sh

defaults: &defaults
  files:
    - README.md
    - CHANGELOG.md
    - BACKLOG.md
    - ROADMAP.md
    - AGENTS.md
    - CONTRIBUTING.md
    - SECURITY.md
    - SUPPORT.md
    - LICENSE
    - docs/adr/.gitkeep
    - docs/architecture/.gitkeep
    - docs/runbooks/.gitkeep
    - .github/copilot-instructions.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/workflows/ci.yml
    - .github/workflows/governance-check.yml

templates:
  base:
    <<: *defaults
    source_repo: vibecoding-template-base
    description: "Generic template for any new project"
    extra_files: []

  infra:
    <<: *defaults
    source_repo: vibecoding-template-infra
    description: "Template for infrastructure, SRE, Ansible, Docker, monitoring projects"
    extra_files:
      - ansible/inventory/.gitkeep
      - ansible/playbooks/.gitkeep
      - ansible/roles/.gitkeep
      - docker/.gitkeep
      - monitoring/dashboards/.gitkeep
      - monitoring/alerts/.gitkeep
      - cmdb/.gitkeep
      - .github/workflows/ansible-lint.yml
      - .github/workflows/docker-build.yml
      - .github/workflows/infrastructure-scan.yml

  ai:
    <<: *defaults
    source_repo: vibecoding-template-ai
    description: "Template for AI, agents, MCP, prompts, RAG, LLM Wiki projects"
    extra_files:
      - agents/.gitkeep
      - prompts/.gitkeep
      - mcp/.gitkeep
      - rag/.gitkeep
      - llm-wiki/.gitkeep
      - .github/workflows/ai-safety-check.yml
      - .github/workflows/model-eval.yml

  app:
    <<: *defaults
    source_repo: vibecoding-template-app
    description: "Template for web applications, APIs, MVPs, portals, SaaS or internal tools"
    extra_files:
      - src/.gitkeep
      - tests/.gitkeep
      - public/.gitkeep
      - .github/workflows/release.yml
      - .github/workflows/a11y-check.yml

  m365:
    <<: *defaults
    source_repo: vibecoding-template-m365-agent
    description: "Template for Microsoft 365 Copilot declarative agents (MCP-backed plugins)"
    extra_files:
      - appPackage/.gitkeep
      - env/.gitkeep
      - .github/workflows/m365-agent-manifest-check.yml
