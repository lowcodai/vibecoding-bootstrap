# config/awesome-copilot-bundles.yml
# Defines the awesome-copilot items to install for each project type
# Source: https://github.com/github/awesome-copilot
#
# Installation:
#   skills  → gh skills install github/awesome-copilot <name>  (requires gh CLI v2.90.0+)
#   plugins → copilot plugin install <name>@awesome-copilot
#   hooks   → copy the hooks/<name>/ directory to .github/hooks/<name>/
#   agents  → copy the agents/<name>.agent.md file to .github/agents/<name>.agent.md
#   instructions → copy the instructions/<name>.instructions.md file to .github/instructions/

# Items common to all project types
common:
  skills:
    - name: acquire-codebase-knowledge
      description: "Quickly acquire knowledge of a codebase"
    - name: breakdown-plan
      description: "Break down a plan into actionable tasks"
    - name: breakdown-epic-arch
      description: "Break down an epic into architecture decisions"
    - name: breakdown-epic-pm
      description: "Break down an epic into PM tasks"
    - name: breakdown-feature-prd
      description: "Generate a PRD for a feature"
    - name: breakdown-feature-implementation
      description: "Implementation plan for a feature"
    - name: breakdown-test
      description: "Generate a test plan"
    - name: audit-integrity
      description: "Audit the integrity of code and configurations"

  hooks:
    - name: tool-guardian
      description: "Controls the tools used by the agent"
      required: true
    - name: secrets-scanner
      description: "Detects secrets in files"
      required: true
    - name: governance-audit
      description: "Project governance audit"
      required: true

  agents:
    - name: adr-generator
      file: adr-generator.agent.md
      description: "Generates ADRs (Architecture Decision Records)"
    - name: prd-generator
      file: prd-generator.agent.md
      description: "Generates PRDs (Product Requirement Documents), ahead of any ADR"
    - name: runbook-generator
      file: runbook-generator.agent.md
      description: "Generates Runbooks (sequenced operational execution detail), downstream of an accepted ADR"

  plugins:
    - name: arch
      description: "Architecture assistant"

  instructions:
    - name: devops-core-principles
      file: devops-core-principles.instructions.md
    - name: github-actions-ci-cd-best-practices
      file: github-actions-ci-cd-best-practices.instructions.md

# Items specific to each project type
bundles:
  base:
    skills: []
    hooks: []
    agents: []
    plugins: []
    instructions: []

  infra:
    skills:
      - name: agent-supply-chain
        description: "Software supply chain analysis"
    hooks:
      - name: dependency-license-checker
        description: "Checks dependency licenses"
      - name: fix-broken-links
        description: "Detects and fixes broken links"
      - name: attester-import-check
        description: "Checks Attester imports"
    agents: []
    plugins: []
    instructions:
      - name: ansible
        file: ansible.instructions.md
      - name: containerization-docker-best-practices
        file: containerization-docker-best-practices.instructions.md

  ai:
    skills:
      - name: acreadiness-assess
        description: "AI Readiness maturity assessment"
      - name: acreadiness-generate-instructions
        description: "Generates instructions for AI projects"
      - name: agent-governance
        description: "AI agent governance"
      - name: agentic-eval
        description: "Agent evaluation"
      - name: ai-prompt-engineering-safety-review
        description: "Prompt engineering safety review"
      - name: agent-owasp-compliance
        description: "OWASP compliance for agents"
      - name: agent-supply-chain
        description: "Supply chain analysis for AI projects"
    hooks:
      - name: session-logger
        description: "Copilot session logging"
      - name: dependency-license-checker
        description: "Checks dependency licenses"
      - name: fix-broken-links
        description: "Detects and fixes broken links"
      - name: attester-import-check
        description: "Checks Attester imports"
      - name: session-auto-commit
        description: "Session auto-commit (feature branches only!)"
        optional: true
        warning: "NEVER on main. Enable only on feature branches."
    agents:
      - name: ai-readiness-reporter
        file: ai-readiness-reporter.agent.md
        description: "AI Readiness maturity report"
      - name: agent-governance-reviewer
        file: agent-governance-reviewer.agent.md
        description: "Agent governance review"
      - name: ai-team-dev
        file: ai-team-dev.agent.md
        description: "AI development team"
    plugins:
      - name: acreadiness-cockpit
        description: "AI Readiness dashboard"
      - name: ai-team-orchestration
        description: "AI team orchestration"
      - name: arize-ax
        description: "LLM observability with Arize (optional)"
        optional: true
    instructions:
      - name: agent-safety
        file: agent-safety.instructions.md
      - name: agent-skills
        file: agent-skills.instructions.md
      - name: ai-prompt-engineering-safety-best-practices
        file: ai-prompt-engineering-safety-best-practices.instructions.md
    arize_skills:
      # Optional — for AI projects with LLM observability
      optional: true
      skills:
        - name: arize-instrumentation
          description: "Arize Phoenix instrumentation"
        - name: arize-dataset
          description: "Arize dataset management"
        - name: arize-evaluator
          description: "Evaluation with Arize"
        - name: arize-prompt-optimization
          description: "Prompt optimization with Arize"

  app:
    skills:
      - name: agent-owasp-compliance
        description: "OWASP compliance"
        optional: true
    hooks:
      - name: dependency-license-checker
        description: "Checks dependency licenses"
      - name: fix-broken-links
        description: "Detects and fixes broken links"
    agents:
      - name: accessibility
        file: accessibility.agent.md
        description: "Accessibility expert"
      - name: accessibility-runtime-tester
        file: accessibility-runtime-tester.agent.md
        description: "Runtime accessibility tests"
      - name: ai-team-dev
        file: ai-team-dev.agent.md
        description: "AI development team"
        optional: true
    plugins:
      - name: ai-team-orchestration
        description: "AI team orchestration"
        optional: true
    instructions:
      - name: a11y
        file: a11y.instructions.md
      - name: containerization-docker-best-practices
        file: containerization-docker-best-practices.instructions.md

# Source reference for verification
awesome_copilot:
  repo: github/awesome-copilot
  # Pin a SHA for reproducibility — update manually
  ref: dae77f24132c1d686c30fd5b29aee0d63668d1d2
  base_url: https://raw.githubusercontent.com/github/awesome-copilot
